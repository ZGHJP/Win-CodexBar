name: Personal Windows build

on:
  push:
    branches: [personal/stable]
    paths: [.github/workflows/personal-windows-build.yml, 'rust/**', 'apps/**', 'personal/**', '!personal/VALIDATION.md', '!personal/README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supersede:
    if: github.repository == 'ZGHJP/Win-CodexBar'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cancel superseded personal builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=ZGHJP/Win-CodexBar
          old_runs=$(gh api "repos/$repo/actions/workflows/personal-windows-build.yml/runs?branch=personal%2Fstable&per_page=20" --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and (.status == \"in_progress\" or .status == \"queued\")) | .id")
          for run in $old_runs; do
            [[ "$run" =~ ^[0-9]+$ ]] || exit 1
            identity=$(gh api "repos/$repo/actions/runs/$run" --jq '.repository.full_name + "|" + .head_branch + "|" + .path')
            [[ "$identity" == "$repo|personal/stable|.github/workflows/personal-windows-build.yml" ]] || exit 1
            bash scripts/gh-safe.sh --repo "$repo" --verify-kind repo -- api "repos/$repo/actions/runs/$run/cancel" --method POST
          done
  build:
    needs: supersede
    if: github.repository == 'ZGHJP/Win-CodexBar'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_DIR: ${{ github.workspace }}-cargo-target
      BUILD_NUMBER: personal-0.70.0-jp.5-gh-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop-tauri/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: personal-external-target-v1
          workspaces: '. -> ../Win-CodexBar-cargo-target'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use a consistent Windows test temporary path
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'codexbar-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" | Add-Content -LiteralPath $env:GITHUB_ENV
          "TMP=$testTemp" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Verify Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --output=rust-format.patch -- '*.rs'
          git diff --exit-code -- '*.rs'
          if ($LASTEXITCODE) { throw 'Apply rust-format.patch to the source before building.' }
      - name: Upload formatter patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-format-patch
          path: rust-format.patch
          if-no-files-found: ignore
      - name: Build locked frontend and run regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir apps/desktop-tauri install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Frontend dependency install failed.' }
          pnpm --dir apps/desktop-tauri exec vitest run --config ../../personal/vitest.config.ts --maxWorkers=4
          if ($LASTEXITCODE) { throw 'Frontend regressions failed.' }
          python -m pip install --requirement personal/usage-compat/requirements.txt
          if ($LASTEXITCODE) { throw 'Compatibility dependency install failed.' }
          python -m unittest discover -s personal/usage-compat -p test_compat.py -v
          if ($LASTEXITCODE) { throw 'Compatibility regressions failed.' }
      - name: Test core Rust manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/worktree-env.ps1 -TargetDirectory $env:CARGO_TARGET_DIR
          cargo test --locked --release --manifest-path rust/Cargo.toml
          if ($LASTEXITCODE) { throw 'Core Rust tests failed.' }
      - name: Test desktop Rust manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/worktree-env.ps1 -TargetDirectory $env:CARGO_TARGET_DIR
          cargo test --locked --release --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { throw 'Desktop Rust tests failed.' }
      - name: Clippy core Rust manifest
        shell: pwsh
        run: |
          . ./scripts/worktree-env.ps1 -TargetDirectory $env:CARGO_TARGET_DIR
          cargo clippy --locked --release --manifest-path rust/Cargo.toml --all-targets -- -D warnings -A clippy::double_must_use
          if ($LASTEXITCODE) { throw 'Core clippy failed.' }
      - name: Clippy desktop Rust manifest
        shell: pwsh
        run: |
          . ./scripts/worktree-env.ps1 -TargetDirectory $env:CARGO_TARGET_DIR
          cargo clippy --locked --release --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::double_must_use
          if ($LASTEXITCODE) { throw 'Desktop clippy failed.' }
      - name: Build native desktop and CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/worktree-env.ps1 -TargetDirectory $env:CARGO_TARGET_DIR
          pnpm --dir apps/desktop-tauri run tauri:build
          if ($LASTEXITCODE) { throw 'Desktop build failed.' }
          cargo build --locked -p codexbar --bin codexbar --release
          if ($LASTEXITCODE) { throw 'CLI build failed.' }
          git diff --exit-code -- Cargo.lock apps/desktop-tauri/pnpm-lock.yaml
          if ($LASTEXITCODE) { throw 'Build changed a lockfile.' }
          ./personal/Package.ps1 -DesktopExecutable "$env:CARGO_TARGET_DIR\release\codexbar-desktop-tauri.exe" -CliExecutable "$env:CARGO_TARGET_DIR\release\codexbar.exe" -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'CodexBar-0.70.0-jp.5-windows-x64') -SourceCommit $env:GITHUB_SHA
      - name: Upload ready-to-install personal build
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar-0.70.0-jp.5-windows-x64
          path: |
            CodexBar-0.70.0-jp.5-windows-x64.zip
            CodexBar-0.70.0-jp.5-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.repository == 'ZGHJP/Win-CodexBar' && github.ref == 'refs/heads/personal/stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CodexBar-0.70.0-jp.5-windows-x64
          path: release-assets
      - name: Publish verified personal binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/ZGHJP/Win-CodexBar/git/ref/heads/personal/stable --jq .object.sha)
          [[ "$latest" == "$GITHUB_SHA" ]] || { echo 'A newer source revision supersedes this build.'; exit 1; }
          cd release-assets
          sha256sum --check CodexBar-0.70.0-jp.5-windows-x64.zip.sha256
          cd ..
          bash scripts/gh-safe.sh --repo ZGHJP/Win-CodexBar --verify-kind repo -- release create personal-v0.70.0-jp.5 --target "$GITHUB_SHA" --title "CodexBar 0.70.0-jp.5 for Windows x64" --notes-file personal/RELEASE-NOTES.md release-assets/CodexBar-0.70.0-jp.5-windows-x64.zip release-assets/CodexBar-0.70.0-jp.5-windows-x64.zip.sha256
